# Root-run pisched uses UDS. WebUI can be reached with an SSH local port forward.
[Service]
ExecStart=
ExecStart=/usr/bin/pisugar-server --config /etc/pisugar-server/config.json --model "PiSugar 3" --uds /tmp/pisugar-server.sock --uds-mode 660 --http 127.0.0.1:8421 --web /usr/share/pisugar-server/web --strict
