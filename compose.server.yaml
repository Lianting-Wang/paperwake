services:
  epaper-server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    env_file:
      - config/server.local.env
    ports:
      - "${SERVER_BIND:-0.0.0.0}:${SERVER_PORT:-8088}:8088"
    volumes:
      - epaper-server-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  epaper-server-data:
