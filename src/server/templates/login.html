{% extends 'base.html' %}
{% block title %}{{ t('登录') }} · {{ t('电子纸管理') }}{% endblock %}
{% block content %}
<section class="login">
  <p class="eyebrow">{{ t('设备状态，一目了然') }}</p>
  <h1>{{ t('连接设备，') }}<br>{{ t('掌握每次更新。') }}</h1>
  <p class="muted">{{ t('登录后可编辑屏幕内容、设置远程调试，并查看设备状态。') }}</p>
  <form method="post" class="panel login-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ t('用户名') }}<input name="username" autocomplete="username" required autofocus></label>
    <label>{{ t('密码') }}<input type="password" name="password" autocomplete="current-password" required></label>
    <button class="primary">{{ t('登录') }} <span>↗</span></button>
  </form>
</section>
{% endblock %}
