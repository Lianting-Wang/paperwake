{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'screen' %}<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 22h8M12 18v4M7 9h10M7 13h6"/>
{% elif name == 'battery' %}<rect x="2" y="6" width="17" height="12" rx="2"/><path d="M22 10v4M6 10v4M10 10v4M14 10v4"/>
{% elif name == 'signal' %}<path d="M3 8a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="20" r=".8"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'check' %}<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>
{% endif %}</svg>
{%- endmacro %}

{% macro screen_preview(display, version) %}
<div class="screen" data-screen-preview>
  <div class="screen-label"><span>E-PAPER</span><span>v{{ version }}</span></div>
  <div class="screen-top"><strong data-preview-title>{{ display.title }}</strong></div>
  <p class="screen-status" data-preview-status>{{ display.status }}</p>
  <dl data-preview-rows>{% for row in display.rows %}<div><dt>{{ row.label }}</dt><dd>{{ row.value }}</dd></div>{% endfor %}</dl>
</div>
{% endmacro %}
