{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'screen' %}<rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 22h8M12 18v4M7 9h10M7 13h6"/>
{% elif name == 'battery' %}<rect x="2" y="6" width="17" height="12" rx="2"/><path d="M22 10v4M6 10v4M10 10v4M14 10v4"/>
{% elif name == 'signal' %}<path d="M3 8a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="20" r=".8"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'check' %}<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>
{% endif %}</svg>
{%- endmacro %}

{% macro screen_preview(device_id) %}
{% set preview_url = url_for('screen_preview', device_id=device_id) %}
<div class="screen-preview" data-screen-preview data-url="{{ preview_url }}" data-error="{{ t('屏幕预览加载失败，请重试。') }}" data-invalid="{{ t('文字超出区域、字体缺字或内容格式无效，请调整内容或版式。') }}" data-loading="{{ t('正在更新预览…') }}">
  <div class="screen"><a href="{{ preview_url }}" data-preview-open target="_blank" rel="noopener"><img data-preview-image src="{{ preview_url }}" width="1872" height="1404" alt="{{ t('电子纸屏幕预览') }}"></a></div>
  <p class="screen-render-message" data-preview-message role="status" hidden></p>
  <div class="screen-tools"><span>{{ t('设备原生布局与字体') }}</span><a href="{{ preview_url }}" data-preview-open target="_blank" rel="noopener">{{ t('查看原尺寸') }} <span aria-hidden="true">↗</span></a></div>
</div>
{% endmacro %}
