<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}电子纸管理{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><div class="shell"><header><a class="brand" href="{{ url_for('dashboard') }}"><span class="brand-mark">e.</span><span>电子纸 <span class="muted">/ 管理中心</span></span></a>{% if session.get('admin') %}<form action="{{ url_for('logout') }}" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="text-button">退出登录</button></form>{% endif %}</header>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<p role="status" class="notice {{ category }}">{{ message }}</p>{% endfor %}{% endwith %}
<main>{% block content %}{% endblock %}</main><footer>电子纸设备管理 <span>修改将在设备下次报到时生效。</span></footer></div></body></html>
